# The owner's second alarm (Stage 12, task 7). The worker starts this only when email itself is failing, so the
# alert can't go through Resend. The run fails on purpose: GitHub then emails the owner "Run failed: <title>",
# and the message (what to do) is shown on the run page. Started by src/lib/alert-once.js; at most once every 6 hours.
name: owner-alert
run-name: ${{ inputs.title }}
on:
  workflow_dispatch:
    inputs:
      title: { description: "Alert title", required: true, type: string }
      message: { description: "What happened and what to do", required: true, type: string }
permissions: {}
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: ${{ inputs.title }}
        env:
          TITLE: ${{ inputs.title }}
          MESSAGE: ${{ inputs.message }}
        run: |
          echo "::error title=${TITLE//[:,]/ }::${MESSAGE//$'\n'/ }"
          echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
