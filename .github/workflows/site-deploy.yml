# Fallback deploy for the static site (the "menu" worker, assets from the repo root). Cloudflare Workers Builds
# normally deploys every push; on Nov 5, 2026 it silently skipped two pushes, so this job waits a few minutes and,
# only if no successful Workers Build exists for the pushed commit, deploys the site itself with the
# CLOUDFLARE_API_TOKEN secret. Run by hand (workflow_dispatch) to force a deploy.
name: Site deploy fallback
on:
  push:
    branches: [master]
    paths-ignore:
      - "booking-api/**"
      - ".github/**"
      - "tools/**"
      - "menu-made-worker/**"
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: site-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for Cloudflare's own build
        id: wait
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "deploy=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          for i in $(seq 1 12); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" -q '[.check_runs[] | select(.app.slug=="cloudflare-workers-and-pages")] | (map(.conclusion // .status) | join(","))')
            echo "Workers Builds: ${state:-none yet}"
            case "$state" in *success*) echo "deploy=no" >> "$GITHUB_OUTPUT"; exit 0;; *in_progress*|*queued*) sleep 30; continue;; esac
            [ "$i" -ge 8 ] && break
            sleep 30
          done
          echo "deploy=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.wait.outputs.deploy == 'yes' && env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: steps.wait.outputs.deploy == 'yes' && env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Deploy the site
        if: steps.wait.outputs.deploy == 'yes' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npx --yes wrangler@4 deploy
          sleep 5
          curl -fsS "https://menu-made.com/online-menu" | grep -q "menu-preview.js" && echo "Site answers"
