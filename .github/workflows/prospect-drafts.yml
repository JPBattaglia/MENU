# Marketing (Nov 1, 2026): the week's prospect emails as drafts in info@menu-made.com (iCloud Mail), after the
# Monday prospect search. Nothing is sent: the owner reviews each draft in Apple Mail and taps Send.
# Needs the ICLOUD_USER and ICLOUD_APP_PASSWORD repository secrets. This public log shows counts only.
name: Prospect drafts
on:
  schedule:
    - cron: "37 15 * * 1"   # Mondays 7:37 am PST, after the 5:23 am prospect search
  workflow_dispatch:
    inputs:
      batch_size:
        description: How many drafts (default 25)
        required: false
      preview:
        description: Browser checks only, no iCloud Mail (true/false)
        required: false
      refresh:
        description: Rebuild the drafts still in Drafts after a design change (true/false)
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: prospect-drafts
  cancel-in-progress: false
jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mail libraries
        run: cd tools/prospects && npm init -y >/dev/null && npm i --no-audit --no-fund imapflow@1 nodemailer@6 playwright@1 && npx playwright install --with-deps chromium
      - name: Sync replies and add this week's drafts
        env:
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          PREVIEW: ${{ inputs.preview }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          if [ "$PREVIEW" != "true" ] && { [ -z "$ICLOUD_USER" ] || [ -z "$ICLOUD_APP_PASSWORD" ]; }; then echo "iCloud Mail is not connected yet (ICLOUD_USER / ICLOUD_APP_PASSWORD secrets)."; exit 1; fi
          node tools/prospects/drafts.mjs
