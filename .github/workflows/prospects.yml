# Marketing (Nov 1, 2026): weekly prospect finder (tools/prospects/find.mjs). Food and drink businesses in San Francisco
# and nearby cities from OpenStreetMap, each website checked for what Menu-made fixes. Results go to the private
# database over this job's OIDC token (no secret); this public log shows counts only.
name: Prospects
on:
  schedule:
    - cron: "23 13 * * 1"   # Mondays 5:23 am PST, ahead of the Monday drafting
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: prospects
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find and check prospects
        run: node tools/prospects/find.mjs
      - name: Mail servers for menu-made.com (public DNS)
        if: always()
        run: dig +short MX menu-made.com; dig +short TXT menu-made.com | grep -i spf || true
