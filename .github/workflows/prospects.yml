# Marketing (Nov 1, 2026): weekly prospect finder (tools/prospects/find.mjs). Food and drink businesses in San Francisco
# and nearby cities from OpenStreetMap, each website checked for what Menu-made fixes. Results go to the private
# database over this job's OIDC token (no secret); this public log shows counts only. Started by the worker on Mondays
# at 5:23 am Pacific (booking-api/src/marketing/prospect-kick.js), not GitHub's timer, since Nov 9, 2026.
name: Prospects
on:
  workflow_dispatch:
    inputs:
      region:
        description: "bay (SF and nearby), next (the next US metro in the rotation), or a metro key from find.mjs"
        required: false
        default: bay
permissions:
  contents: read
  id-token: write
concurrency:
  group: prospects
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find and check prospects
        run: node tools/prospects/find.mjs
        env:
          REGION: ${{ inputs.region }}
      - name: Mail servers for menu-made.com (public DNS)
        if: always()
        run: dig +short MX menu-made.com; dig +short TXT menu-made.com | grep -i spf || true
