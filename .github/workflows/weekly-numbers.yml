# Marketing plan v4 (Nov 3, 2026): the owner's Friday numbers email, both businesses (src/marketing/weekly-numbers.js).
# Calls the worker over GitHub OIDC (no secret); the worker reads its own records and the Nino shop's, and sends the
# email. This public log shows only whether it was sent.
name: weekly-numbers
on:
  schedule: [{ cron: "23 16 * * 5" }]   # Fridays 8:23 am PST
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the worker to send the Friday numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # GitHub's scheduler can run hours late. If Claude already sent today's email by hand, a late scheduled run skips (Nov 6, 2026).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            done_today=$(gh api "repos/${{ github.repository }}/actions/workflows/weekly-numbers.yml/runs?status=success&created=>=$(date -u +%Y-%m-%d)" --jq '.total_count')
            if [ "$done_today" != "0" ]; then echo "Already sent today; skipping."; exit 0; fi
          fi
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-weekly-numbers" | jq -r .value)
          res=$(curl -sS -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{}' https://menu-made.com/api/system/weekly-numbers)
          echo "$res" | jq -c '{ok, lines, error}'
          echo "$res" | jq -e '.ok == true' >/dev/null
