# Builds the Store App (stage 11 part 2) on GitHub's standard runners, which are free and unmetered because
# this repo is public: iOS on macOS, Android on Linux. Current version proves the pipeline with the fictional
# Sample Cafe: unsigned iOS simulator build and Android debug APK on every push; manual runs with upload ticked also
# sign the iOS build and upload it to TestFlight, with the key fetched from the worker over this workflow's OIDC token
# and masked (it never lives in this repo). patch-ios.mjs adds the AppDelegate hooks native push needs.
#
# Public repo = public logs: never print customer data, keys or signing material here.
name: Store app build

on:
  workflow_dispatch:
    inputs:
      config:
        description: Build config path
        default: app-shell/sample/build.json
      upload:
        description: Sign and upload (iOS to TestFlight, Android to Play internal testing)
        type: boolean
        default: false
      platforms:
        description: Which signed builds to make when upload is ticked
        type: choice
        options: [both, ios, android]
        default: both
  push:
    branches: [master]
    paths:
      - "app-shell/**"
      - ".github/workflows/store-app-build.yml"

concurrency:
  group: store-app-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # only the TestFlight job uses it, to fetch the App Store Connect key from the worker

env:
  CONFIG: ${{ inputs.config || 'app-shell/sample/build.json' }}
  CAP_PACKAGES: "@capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest @capacitor/android@latest @capacitor/push-notifications@latest"

jobs:
  # The app's content comes live from the restaurant's Guest App (<app>/api/content). Checks it answers like the app
  # expects. Retries for up to 10 minutes because a push that also changes the worker deploys it in parallel.
  # Prints only counts and yes/no, never the content.
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # On iPhone the app's own files load from capacitor://localhost, which "https:" does not cover: connect-src must
      # include 'self' or the app can't read its own config.json (first TestFlight build, Oct 29, 2026).
      - name: App page allows reading its own files
        run: grep -q "connect-src 'self'" app-shell/www/index.html
      - name: Live content endpoint
        run: |
          base=$(jq -r .api_base "$CONFIG")
          for i in $(seq 1 20); do
            if curl -sSf -H "Origin: capacitor://localhost" -D headers.txt "$base/content" -o content.json 2>/dev/null \
               && jq -e '.ok == true and (.name | length > 0) and (.menu | type == "array") and (.hours | type == "array") and (.loyalty | has("enabled"))' content.json >/dev/null \
               && grep -qi '^access-control-allow-origin: capacitor://localhost' headers.txt; then
              jq -r '"content ok: \(.menu | length) menu sections, \(.hours | length) hours lines, specials \(if .specials != "" then "yes" else "no" end), rewards \(if .loyalty.enabled then "on" else "off" end)"' content.json | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "not ready yet ($i/20)"; sleep 30
          done
          echo "The content endpoint never answered as expected"; exit 1

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        working-directory: app-shell
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund $CAP_PACKAGES
          npx cap --version
      - name: Configure and add Android
        run: |
          node app-shell/configure.mjs "$CONFIG"
          cd app-shell && npx cap add android && npx cap sync android
      - name: Build debug APK
        working-directory: app-shell/android
        run: |
          start=$(date +%s)
          ./gradlew assembleDebug --no-daemon -q
          echo "ANDROID_BUILD_SECONDS=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: sample-android-apk
          path: app-shell/android/app/build/outputs/apk/debug/*.apk
          retention-days: 3

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        working-directory: app-shell
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund $CAP_PACKAGES
          npx cap --version
          xcodebuild -version
      - name: Configure and add iOS
        run: |
          node app-shell/configure.mjs "$CONFIG"
          cd app-shell && npx cap add ios && npx cap sync ios
          node patch-ios.mjs
          ls ios/App
      - name: Build for the iOS simulator (unsigned)
        working-directory: app-shell/ios/App
        run: |
          start=$(date +%s)
          if [ -d App.xcworkspace ]; then target="-workspace App.xcworkspace"; else target="-project App.xcodeproj"; fi
          xcodebuild $target -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build -quiet
          echo "IOS_BUILD_SECONDS=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ls build/Build/Products/Release-iphonesimulator/

  # Signed iOS build uploaded to TestFlight (manual runs with upload ticked only). Signing is Xcode's automatic signing
  # with the App Store Connect API key (Admin), so certificates and profiles are created and kept by Apple; nothing is
  # stored here. The key comes from the worker over this job's OIDC token and every line of it is masked.
  ios-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload && inputs.platforms != 'android'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode on the runner (App Store uploads need a current SDK)
        run: |
          xc=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$xc" ] && sudo xcode-select -s "$xc"
          xcodebuild -version
      - name: Fetch the App Store Connect key from the worker
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          curl -sSf -H "Authorization: Bearer $token" "https://menu-made.com/api/store-build/credentials?scope=owner" -o "$RUNNER_TEMP/creds.json"
          jq -r .apple.p8 "$RUNNER_TEMP/creds.json" | while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done
          jq -r .apple.p8 "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "ASC_KEY_ID=$(jq -r .apple.key_id "$RUNNER_TEMP/creds.json")"
            echo "ASC_ISSUER_ID=$(jq -r .apple.issuer_id "$RUNNER_TEMP/creds.json")"
            echo "TEAM_ID=$(jq -r .apple.team_id "$RUNNER_TEMP/creds.json")"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/creds.json"
          echo "Key received"
      - name: Install Capacitor and make the iOS project
        run: |
          cd app-shell && npm init -y >/dev/null && npm install --no-audit --no-fund $CAP_PACKAGES && cd ..
          node app-shell/configure.mjs "$CONFIG"
          cd app-shell && npx cap add ios && npx cap sync ios
          node patch-ios.mjs
          grep -q capacitorDidRegisterForRemoteNotifications ios/App/App/AppDelegate.swift
          plist=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$plist"
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          PLIST
          sed -i '' 's/^          //' ios/App/App/App.entitlements
      - name: Archive (signed)
        working-directory: app-shell/ios/App
        run: |
          if [ -d App.xcworkspace ]; then target="-workspace App.xcworkspace"; else target="-project App.xcodeproj"; fi
          app_id=$(jq -r .app_id "$GITHUB_WORKSPACE/$CONFIG"); version=$(jq -r '.version // "1.0.0"' "$GITHUB_WORKSPACE/$CONFIG")
          xcodebuild $target -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_ENTITLEMENTS=App/App.entitlements PRODUCT_BUNDLE_IDENTIFIER="$app_id" \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive -quiet
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/creds.json"

  # Signed Android build (manual runs with upload ticked). google-services.json (push), the Google Play account and the
  # upload key come from the worker over this job's OIDC token, every secret line masked. The first run makes the
  # upload key and hands it to the worker, so later builds sign with the same key (Google Play App Signing holds the real
  # signing key). Google only takes a new app's first file by hand: when Play doesn't know the app yet, the .aab goes to
  # the worker, which emails the owner a download link and the steps.
  android-play:
    if: github.event_name == 'workflow_dispatch' && inputs.upload && inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fetch the Android files from the worker
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          echo "OIDC_TOKEN=$token" >> "$GITHUB_ENV"
          curl -sSf -H "Authorization: Bearer $token" "https://menu-made.com/api/store-build/credentials?scope=owner&platform=android" -o "$RUNNER_TEMP/creds.json"
          if jq -e '.android.play_account != null' "$RUNNER_TEMP/creds.json" >/dev/null; then
            jq -r .android.play_account "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/play.json"
            jq -r .private_key "$RUNNER_TEMP/play.json" | while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done
            echo "PLAY_ACCOUNT_FILE=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"
          fi
          jq -r .android.google_services "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/google-services.json"
          if jq -e '.android.upload_key == null' "$RUNNER_TEMP/creds.json" >/dev/null; then
            pass=$(openssl rand -hex 24); echo "::add-mask::$pass"
            keytool -genkeypair -keystore "$RUNNER_TEMP/new.jks" -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=Menu-made upload key" -noprompt >/dev/null 2>&1
            jq -n --arg jks "$(base64 -w0 "$RUNNER_TEMP/new.jks")" --arg password "$pass" '{jks: $jks, password: $password}' \
              | curl -sSf -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data-binary @- \
                "https://menu-made.com/api/store-build/android-key?scope=owner" -o "$RUNNER_TEMP/key.json"
            rm -f "$RUNNER_TEMP/new.jks"
            echo "Made a new upload key and handed it to the worker"
          else
            jq '{upload_key: .android.upload_key}' "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/key.json"
          fi
          kp=$(jq -r .upload_key.password "$RUNNER_TEMP/key.json"); echo "::add-mask::$kp"
          jq -r .upload_key.jks "$RUNNER_TEMP/key.json" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEY_PASS=$kp" >> "$GITHUB_ENV"
          echo "PACKAGE=$(jq -r .android.package "$RUNNER_TEMP/creds.json")" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/creds.json" "$RUNNER_TEMP/key.json"
          echo "Files received"
      - name: Make the Android project (with push)
        run: |
          cd app-shell && npm init -y >/dev/null && npm install --no-audit --no-fund $CAP_PACKAGES && cd ..
          node app-shell/configure.mjs "$CONFIG"
          [ "$(jq -r .app_id "$CONFIG")" = "$PACKAGE" ] || { echo "Build config app_id doesn't match the Google files"; exit 1; }
          jq '.push_android = true' app-shell/www/config.json > app-shell/www/c.json && mv app-shell/www/c.json app-shell/www/config.json
          cd app-shell && npx cap add android
          cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json
          npx cap sync android
          version=$(jq -r '.version // "1.0.0"' "$GITHUB_WORKSPACE/$CONFIG")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$version\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build the signed bundle
        working-directory: app-shell/android
        run: |
          ./gradlew bundleRelease --no-daemon -q \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" -Pandroid.injected.signing.store.password="$KEY_PASS" \
            -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password="$KEY_PASS"
          ls -la app/build/outputs/bundle/release/
      - name: Upload to Google Play internal testing
        run: |
          aab=app-shell/android/app/build/outputs/bundle/release/app-release.aab
          code=0
          if [ -n "$PLAY_ACCOUNT_FILE" ]; then node booking-api/scripts/play-upload.mjs "$aab" "$PACKAGE" "${{ github.run_number }}" || code=$?; else echo "No Google Play account yet"; code=3; fi
          if [ "$code" = "3" ]; then
            curl -sSf -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$aab" \
              "https://menu-made.com/api/store-build/android-bundle?scope=owner&version=${{ github.run_number }}" | jq -c '{stored, emailed}'
            echo "First upload: build ${{ github.run_number }} emailed to the owner to upload by hand" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$code" = "0" ]; then
            echo "Uploaded build ${{ github.run_number }} to Google Play internal testing" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            exit "$code"
          fi
      - name: Remove the files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json" "$RUNNER_TEMP/google-services.json" "$RUNNER_TEMP/creds.json" "$RUNNER_TEMP/key.json"
