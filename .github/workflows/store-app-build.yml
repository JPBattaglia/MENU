# Builds the Store App (stage 11 part 2) on GitHub's standard runners, which are free and unmetered because
# this repo is public: iOS on macOS, Android on Linux. Current version proves the pipeline with the fictional
# Sample Cafe: unsigned iOS simulator build and Android debug APK on every push; manual runs with upload ticked also
# sign the iOS build and upload it to TestFlight, with the key fetched from the worker over this workflow's OIDC token
# and masked (it never lives in this repo). patch-ios.mjs adds the AppDelegate hooks native push needs.
#
# iPhone only (TARGETED_DEVICE_FAMILY=1): an iPad build would need iPad screenshots in the App Store listing.
# Restaurants (Oct 30, 2026): the worker starts this workflow with store_app=<store app id>, upload ticked. The
# restaurant-config job then fetches that app's build config and icons from the worker (booking-api/scripts/
# store-icons.mjs draws them), every later job builds from those instead of the sample, keys come by store app id, and
# each signed job reports its result back (POST /api/store-build/result), which moves the app along or alerts the owner.
#
# Public repo = public logs: never print customer data, keys or signing material here.
name: Store app build

on:
  workflow_dispatch:
    inputs:
      config:
        description: Build config path
        default: app-shell/sample/build.json
      upload:
        description: Sign and upload (iOS to TestFlight, Android to Play internal testing)
        type: boolean
        default: false
      store_app:
        description: Store App id (set by the worker for a restaurant's build; empty = the sample config)
        default: ""
      platforms:
        description: Which signed builds to make when upload is ticked
        type: choice
        options: [both, ios, android, android-device-test, ios-attach]
        default: both
      attach_build:
        description: "With platforms=ios-attach: the build number to add to TestFlight and the waiting App Store version (no new build)"
        default: ""
  push:
    branches: [master]
    paths:
      - "app-shell/**"
      - ".github/workflows/store-app-build.yml"

concurrency:
  group: store-app-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # only the TestFlight job uses it, to fetch the App Store Connect key from the worker

env:
  SAMPLE_CONFIG: ${{ inputs.config || 'app-shell/sample/build.json' }}
  STORE_APP: ${{ inputs.store_app || '' }}
  CAP_PACKAGES: "@capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest @capacitor/android@latest @capacitor/push-notifications@latest @capacitor/browser@latest"

jobs:
  # A restaurant's build (store_app set): its build config and icons from the worker, over this job's OIDC token. The
  # answer is the restaurant's public app content (it goes into the stores), but it is never printed here.
  restaurant-config:
    if: inputs.store_app != '' && inputs.platforms != 'ios-attach'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the renderer (resvg only)
        working-directory: booking-api
        run: npm install --omit=dev --no-audit --no-fund
      - name: Fetch the build config
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          curl -sSf -H "Authorization: Bearer $token" "https://menu-made.com/api/store-build/config?store_app=$STORE_APP" -o "$RUNNER_TEMP/config.json"
          echo "Config received"
      - name: Draw the icons
        run: |
          node booking-api/scripts/store-icons.mjs "$RUNNER_TEMP/config.json" "$RUNNER_TEMP/restaurant"
          node app-shell/configure.mjs "$RUNNER_TEMP/restaurant/build.json" >/dev/null
          echo "Build config checked"
      # Store listing pictures (store-listing.js): screenshots of the real app screens with the live content, plus the
      # Play icon and feature graphic drawn above, sent to the worker. The owner sees them before anything is submitted.
      - name: Take the store screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8123 --directory app-shell/www >/dev/null 2>&1 &
          sleep 1
          PW_DIR="$RUNNER_TEMP/pw" node booking-api/scripts/store-screenshots.mjs http://127.0.0.1:8123/ "$RUNNER_TEMP/restaurant/listing"
      - name: Send the listing pictures to the worker
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          for f in "$RUNNER_TEMP"/restaurant/listing/*.png; do
            name=$(basename "$f" .png)
            curl -sSf -X POST -H "Authorization: Bearer $token" -H "Content-Type: image/png" --data-binary @"$f" \
              "https://menu-made.com/api/store-build/listing?store_app=$STORE_APP&name=$name" -o /dev/null
          done
          echo "Listing pictures sent: $(ls "$RUNNER_TEMP"/restaurant/listing/*.png | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-config
          path: ${{ runner.temp }}/restaurant
          retention-days: 3
      - name: Tell the worker the build couldn't start
        if: failure()
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          curl -sS -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data "{\"platform\":\"ios\",\"outcome\":\"FAILED\",\"version\":${{ github.run_number }},\"run_id\":\"${{ github.run_id }}\"}" \
            "https://menu-made.com/api/store-build/result?store_app=$STORE_APP" >/dev/null

  # The app's content comes live from the restaurant's Guest App (<app>/api/content). Checks it answers like the app
  # expects. Retries for up to 10 minutes because a push that also changes the worker deploys it in parallel.
  # Prints only counts and yes/no, never the content.
  content:
    needs: restaurant-config
    if: ${{ !cancelled() && needs.restaurant-config.result != 'failure' && inputs.platforms != 'android-device-test' && inputs.platforms != 'ios-attach' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get the restaurant's build config and icons
        if: env.STORE_APP != ''
        uses: actions/download-artifact@v4
        with:
          name: restaurant-config
          path: app-shell/restaurant
      - name: Pick the build config
        run: |
          if [ -n "$STORE_APP" ]; then
            echo "CONFIG=app-shell/restaurant/build.json" >> "$GITHUB_ENV"; echo "TARGET=store_app=$STORE_APP" >> "$GITHUB_ENV"
          else
            echo "CONFIG=$SAMPLE_CONFIG" >> "$GITHUB_ENV"; echo "TARGET=scope=owner" >> "$GITHUB_ENV"
          fi
      # On iPhone the app's own files load from capacitor://localhost, which "https:" does not cover: connect-src must
      # include 'self' or the app can't read its own config.json (first TestFlight build, Oct 29, 2026).
      - name: App page allows reading its own files
        run: grep -q "connect-src 'self'" app-shell/www/index.html
      - name: Live content endpoint
        run: |
          hybrid=$(jq -r '.hybrid_url // empty' "$CONFIG")
          if [ -n "$hybrid" ]; then
            for i in $(seq 1 20); do
              if curl -sSf -H "Origin: capacitor://localhost" "$hybrid" -o hybrid.json 2>/dev/null && jq -e '.ok == true and (.tabs | length > 0)' hybrid.json >/dev/null; then
                jq -r '"hybrid content ok: \(.tabs | length) tabs, \((.products // []) | length) products, \((.plans // []) | length) plans"' hybrid.json | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "not ready yet ($i/20)"; sleep 30
            done
            echo "The hybrid content endpoint never answered as expected"; exit 1
          fi
          if [ -n "$(jq -r '.site_url // empty' "$CONFIG")" ]; then echo "Site app: the website is the content" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          base=$(jq -r .api_base "$CONFIG")
          for i in $(seq 1 20); do
            if curl -sSf -H "Origin: capacitor://localhost" -D headers.txt "$base/content" -o content.json 2>/dev/null \
               && jq -e '.ok == true and (.name | length > 0) and (.menu | type == "array") and (.hours | type == "array") and (.loyalty | has("enabled"))' content.json >/dev/null \
               && grep -qi '^access-control-allow-origin: capacitor://localhost' headers.txt; then
              jq -r '"content ok: \(.menu | length) menu sections, \(.hours | length) hours lines, specials \(if .specials != "" then "yes" else "no" end), rewards \(if .loyalty.enabled then "on" else "off" end)"' content.json | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "not ready yet ($i/20)"; sleep 30
          done
          echo "The content endpoint never answered as expected"; exit 1

  android:
    if: inputs.store_app == '' && inputs.platforms != 'android-device-test' && inputs.platforms != 'ios-attach'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the restaurant's build config and icons
        if: env.STORE_APP != ''
        uses: actions/download-artifact@v4
        with:
          name: restaurant-config
          path: app-shell/restaurant
      - name: Pick the build config
        run: |
          if [ -n "$STORE_APP" ]; then
            echo "CONFIG=app-shell/restaurant/build.json" >> "$GITHUB_ENV"; echo "TARGET=store_app=$STORE_APP" >> "$GITHUB_ENV"
          else
            echo "CONFIG=$SAMPLE_CONFIG" >> "$GITHUB_ENV"; echo "TARGET=scope=owner" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        working-directory: app-shell
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund $CAP_PACKAGES
          npx cap --version
      - name: Configure and add Android
        run: |
          node app-shell/configure.mjs "$CONFIG"
          cd app-shell && npx cap add android && npx cap sync android
      - name: Build debug APK
        working-directory: app-shell/android
        run: |
          start=$(date +%s)
          ./gradlew assembleDebug --no-daemon -q
          echo "ANDROID_BUILD_SECONDS=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: sample-android-apk
          path: app-shell/android/app/build/outputs/apk/debug/*.apk
          retention-days: 3

  ios:
    if: inputs.store_app == '' && inputs.platforms != 'android-device-test' && inputs.platforms != 'ios-attach'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get the restaurant's build config and icons
        if: env.STORE_APP != ''
        uses: actions/download-artifact@v4
        with:
          name: restaurant-config
          path: app-shell/restaurant
      - name: Pick the build config
        run: |
          if [ -n "$STORE_APP" ]; then
            echo "CONFIG=app-shell/restaurant/build.json" >> "$GITHUB_ENV"; echo "TARGET=store_app=$STORE_APP" >> "$GITHUB_ENV"
          else
            echo "CONFIG=$SAMPLE_CONFIG" >> "$GITHUB_ENV"; echo "TARGET=scope=owner" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        working-directory: app-shell
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund $CAP_PACKAGES
          npx cap --version
          xcodebuild -version
      - name: Configure and add iOS
        run: |
          node app-shell/configure.mjs "$CONFIG"
          cd app-shell && npx cap add ios && npx cap sync ios
          node patch-ios.mjs
          ls ios/App
      - name: Build for the iOS simulator (unsigned)
        working-directory: app-shell/ios/App
        run: |
          start=$(date +%s)
          if [ -d App.xcworkspace ]; then target="-workspace App.xcworkspace"; else target="-project App.xcodeproj"; fi
          xcodebuild $target -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build -quiet
          echo "IOS_BUILD_SECONDS=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ls build/Build/Products/Release-iphonesimulator/

  # Signed iOS build uploaded to TestFlight (manual runs with upload ticked only). Signing is Xcode's automatic signing
  # with the App Store Connect API key (Admin), so certificates and profiles are created and kept by Apple; nothing is
  # stored here. The key comes from the worker over this job's OIDC token and every line of it is masked.
  ios-testflight:
    needs: restaurant-config
    if: ${{ !cancelled() && needs.restaurant-config.result != 'failure' && github.event_name == 'workflow_dispatch' && inputs.upload && (inputs.platforms == 'both' || inputs.platforms == 'ios') }}
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Get the restaurant's build config and icons
        if: env.STORE_APP != ''
        uses: actions/download-artifact@v4
        with:
          name: restaurant-config
          path: app-shell/restaurant
      - name: Pick the build config
        run: |
          if [ -n "$STORE_APP" ]; then
            echo "CONFIG=app-shell/restaurant/build.json" >> "$GITHUB_ENV"; echo "TARGET=store_app=$STORE_APP" >> "$GITHUB_ENV"
          else
            echo "CONFIG=$SAMPLE_CONFIG" >> "$GITHUB_ENV"; echo "TARGET=scope=owner" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode on the runner (App Store uploads need a current SDK)
        run: |
          xc=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$xc" ] && sudo xcode-select -s "$xc"
          xcodebuild -version
      - name: Fetch the App Store Connect key from the worker
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          curl -sSf -H "Authorization: Bearer $token" "https://menu-made.com/api/store-build/credentials?$TARGET" -o "$RUNNER_TEMP/creds.json"
          jq -r .apple.p8 "$RUNNER_TEMP/creds.json" | while IFS= read -r line; do if [ -n "$line" ]; then echo "::add-mask::$line"; fi; done
          jq -r .apple.p8 "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "ASC_KEY_ID=$(jq -r .apple.key_id "$RUNNER_TEMP/creds.json")"
            echo "ASC_ISSUER_ID=$(jq -r .apple.issuer_id "$RUNNER_TEMP/creds.json")"
            echo "TEAM_ID=$(jq -r .apple.team_id "$RUNNER_TEMP/creds.json")"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/creds.json"
          echo "Key received"
      - name: Install Capacitor and make the iOS project
        run: |
          cd app-shell && npm init -y >/dev/null && npm install --no-audit --no-fund $CAP_PACKAGES && cd ..
          node app-shell/configure.mjs "$CONFIG"
          cd app-shell && npx cap add ios && npx cap sync ios
          node patch-ios.mjs
          if [ -f restaurant/ios/icon-1024.png ]; then
            for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do
              w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
              # Apple refuses an app icon with an alpha channel: a JPEG round trip drops it.
              sips -s format jpeg -s formatOptions best -z "$w" "$w" restaurant/ios/icon-1024.png --out "$RUNNER_TEMP/icon.jpg" >/dev/null
              sips -s format png "$RUNNER_TEMP/icon.jpg" --out "$f" >/dev/null
            done
            echo "App icon set from the restaurant's icon"
          fi
          grep -q capacitorDidRegisterForRemoteNotifications ios/App/App/AppDelegate.swift
          plist=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$plist"
          # Hybrid apps (hybrid.js) let a business owner take a photo of a menu for the free preview: Apple requires
          # the reason in the camera and photo prompts, or the app is rejected (and crashes on the camera).
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Take a photo of your menu to make a free preview.'" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Choose a photo of your menu to make a free preview.'" "$plist" 2>/dev/null || true
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          PLIST
          sed -i '' 's/^          //' ios/App/App/App.entitlements
      - name: Free a signing certificate slot (each fresh Mac makes a new development certificate)
        run: node booking-api/scripts/asc-free-cert-slot.mjs "$RUNNER_TEMP/AuthKey.p8" "$ASC_KEY_ID" "$ASC_ISSUER_ID"
      - name: Archive (signed)
        working-directory: app-shell/ios/App
        run: |
          if [ -d App.xcworkspace ]; then target="-workspace App.xcworkspace"; else target="-project App.xcodeproj"; fi
          app_id=$(jq -r .app_id "$GITHUB_WORKSPACE/$CONFIG"); version=$(jq -r '.version // "1.0.0"' "$GITHUB_WORKSPACE/$CONFIG")
          xcodebuild $target -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            TARGETED_DEVICE_FAMILY=1 DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_ENTITLEMENTS=App/App.entitlements PRODUCT_BUNDLE_IDENTIFIER="$app_id" \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive -quiet
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect" | tee -a "$GITHUB_STEP_SUMMARY"
      # Nov 9, 2026: adds the build to the internal TestFlight group and swaps it into the App Store version waiting for
      # review (if that version can still be changed), so nobody clicks it in App Store Connect. Never submits.
      - name: Put the build in TestFlight and the waiting App Store version
        continue-on-error: true
        timeout-minutes: 45
        run: |
          app_id=$(jq -r .app_id "$CONFIG"); version=$(jq -r '.version // "1.0.0"' "$CONFIG")
          node booking-api/scripts/asc-attach-build.mjs "$RUNNER_TEMP/AuthKey.p8" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$app_id" "$version" "${{ github.run_number }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/creds.json"
      - name: Report the result to the worker
        if: ${{ always() && env.STORE_APP != '' }}
        run: |
          outcome="${{ job.status == 'success' && 'UPLOADED' || 'FAILED' }}"
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          jq -n --arg o "$outcome" --arg run "${{ github.run_id }}" '{platform: "ios", outcome: $o, version: ${{ github.run_number }}, run_id: $run}' \
            | curl -sSf -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data-binary @- \
              "https://menu-made.com/api/store-build/result?store_app=$STORE_APP" | jq -c '{status}'

  # Signed Android build (manual runs with upload ticked). google-services.json (push), the Google Play account and the
  # upload key come from the worker over this job's OIDC token, every secret line masked. The first run makes the
  # upload key and hands it to the worker, so later builds sign with the same key (Google Play App Signing holds the real
  # signing key). Google only takes a new app's first file by hand: when Play doesn't know the app yet, the .aab goes to
  # the worker, which emails the owner a download link and the steps.
  android-play:
    needs: restaurant-config
    if: ${{ !cancelled() && needs.restaurant-config.result != 'failure' && github.event_name == 'workflow_dispatch' && inputs.upload && (inputs.platforms == 'both' || inputs.platforms == 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the restaurant's build config and icons
        if: env.STORE_APP != ''
        uses: actions/download-artifact@v4
        with:
          name: restaurant-config
          path: app-shell/restaurant
      - name: Pick the build config
        run: |
          if [ -n "$STORE_APP" ]; then
            echo "CONFIG=app-shell/restaurant/build.json" >> "$GITHUB_ENV"; echo "TARGET=store_app=$STORE_APP" >> "$GITHUB_ENV"
          else
            echo "CONFIG=$SAMPLE_CONFIG" >> "$GITHUB_ENV"; echo "TARGET=scope=owner" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fetch the Android files from the worker
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          echo "OIDC_TOKEN=$token" >> "$GITHUB_ENV"
          curl -sSf -H "Authorization: Bearer $token" "https://menu-made.com/api/store-build/credentials?$TARGET&platform=android" -o "$RUNNER_TEMP/creds.json"
          if jq -e '.android.play_account != null' "$RUNNER_TEMP/creds.json" >/dev/null; then
            jq -r .android.play_account "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/play.json"
            jq -r .private_key "$RUNNER_TEMP/play.json" | while IFS= read -r line; do if [ -n "$line" ]; then echo "::add-mask::$line"; fi; done
            echo "PLAY_ACCOUNT_FILE=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"
          fi
          jq -r .android.google_services "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/google-services.json"
          if jq -e '.android.upload_key == null' "$RUNNER_TEMP/creds.json" >/dev/null; then
            pass=$(openssl rand -hex 24); echo "::add-mask::$pass"
            keytool -genkeypair -keystore "$RUNNER_TEMP/new.jks" -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=Menu-made upload key" -noprompt >/dev/null 2>&1
            jq -n --arg jks "$(base64 -w0 "$RUNNER_TEMP/new.jks")" --arg password "$pass" '{jks: $jks, password: $password}' \
              | curl -sSf -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data-binary @- \
                "https://menu-made.com/api/store-build/android-key?$TARGET" -o "$RUNNER_TEMP/key.json"
            rm -f "$RUNNER_TEMP/new.jks"
            echo "Made a new upload key and handed it to the worker"
          else
            jq '{upload_key: .android.upload_key}' "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/key.json"
          fi
          kp=$(jq -r .upload_key.password "$RUNNER_TEMP/key.json"); echo "::add-mask::$kp"
          jq -r .upload_key.jks "$RUNNER_TEMP/key.json" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEY_PASS=$kp" >> "$GITHUB_ENV"
          echo "PACKAGE=$(jq -r .android.package "$RUNNER_TEMP/creds.json")" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/creds.json" "$RUNNER_TEMP/key.json"
          echo "Files received"
      - name: Make the Android project (with push)
        run: |
          cd app-shell && npm init -y >/dev/null && npm install --no-audit --no-fund $CAP_PACKAGES && cd ..
          node app-shell/configure.mjs "$CONFIG"
          [ "$(jq -r .app_id "$CONFIG")" = "$PACKAGE" ] || { echo "Build config app_id doesn't match the Google files"; exit 1; }
          jq '.push_android = true' app-shell/www/config.json > app-shell/www/c.json && mv app-shell/www/c.json app-shell/www/config.json
          cd app-shell && npx cap add android
          if [ -d restaurant/android/res ]; then cp -R restaurant/android/res/. android/app/src/main/res/; echo "Launcher icons set from the restaurant's icon"; fi
          cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json
          npx cap sync android
          version=$(jq -r '.version // "1.0.0"' "$GITHUB_WORKSPACE/$CONFIG")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$version\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build the signed bundle
        working-directory: app-shell/android
        run: |
          ./gradlew bundleRelease --no-daemon -q \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" -Pandroid.injected.signing.store.password="$KEY_PASS" \
            -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password="$KEY_PASS"
          ls -la app/build/outputs/bundle/release/
      - name: Upload to Google Play internal testing
        run: |
          aab=app-shell/android/app/build/outputs/bundle/release/app-release.aab
          code=0
          if [ -n "$PLAY_ACCOUNT_FILE" ]; then node booking-api/scripts/play-upload.mjs "$aab" "$PACKAGE" "${{ github.run_number }}" || code=$?; else echo "No Google Play account yet"; code=3; fi
          if [ "$code" = "3" ]; then
            curl -sSf -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$aab" \
              "https://menu-made.com/api/store-build/android-bundle?$TARGET&version=${{ github.run_number }}" | jq -c '{stored, emailed}'
            echo "First upload: build ${{ github.run_number }} emailed to the owner to upload by hand" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ANDROID_OUTCOME=FIRST_UPLOAD" >> "$GITHUB_ENV"
          elif [ "$code" = "0" ]; then
            echo "Uploaded build ${{ github.run_number }} to Google Play internal testing" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ANDROID_OUTCOME=UPLOADED" >> "$GITHUB_ENV"
          else
            exit "$code"
          fi
      - name: Remove the files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json" "$RUNNER_TEMP/google-services.json" "$RUNNER_TEMP/creds.json" "$RUNNER_TEMP/key.json"
      - name: Report the result to the worker
        if: ${{ always() && env.STORE_APP != '' }}
        run: |
          outcome="${{ job.status == 'success' && '${ANDROID_OUTCOME:-FAILED}' || 'FAILED' }}"
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          jq -n --arg o "$outcome" --arg run "${{ github.run_id }}" '{platform: "android", outcome: $o, version: ${{ github.run_number }}, run_id: $run}' \
            | curl -sSf -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data-binary @- \
              "https://menu-made.com/api/store-build/result?store_app=$STORE_APP" | jq -c '{status}'

  # Android device test (Nov 3, 2026; replaces the owner's phone check, which needs an Android phone he doesn't have).
  # Manual run with platforms = android-device-test (and nothing else: no upload, no store change). Builds the Sample
  # Cafe app signed exactly like the Google Play build (google-services.json and the upload key from the worker),
  # starts a virtual Android phone with Google Play services on this runner, installs and opens the app, which loads
  # the live content and registers for notifications with the worker like a guest's phone. Then the worker sends that
  # phone one notification through its Firebase sender (/api/store-build/android-push-test) and the job checks it
  # reached the phone's notification shade. Screenshots are kept as an artifact. Prints only yes/no and counts.
  android-device-test:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'android-device-test' && inputs.store_app == ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fetch the Android files from the worker
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          curl -sSf -H "Authorization: Bearer $token" "https://menu-made.com/api/store-build/credentials?scope=owner&platform=android" -o "$RUNNER_TEMP/creds.json"
          jq -r .android.google_services "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/google-services.json"
          jq -e '.android.upload_key != null' "$RUNNER_TEMP/creds.json" >/dev/null || { echo "No upload key yet: run a signed Android build first"; exit 1; }
          kp=$(jq -r .android.upload_key.password "$RUNNER_TEMP/creds.json"); echo "::add-mask::$kp"
          jq -r .android.upload_key.jks "$RUNNER_TEMP/creds.json" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEY_PASS=$kp" >> "$GITHUB_ENV"
          echo "PACKAGE=$(jq -r .android.package "$RUNNER_TEMP/creds.json")" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/creds.json"
          echo "Files received"
      - name: Make the Android project (with push)
        run: |
          CONFIG="$SAMPLE_CONFIG"
          cd app-shell && npm init -y >/dev/null && npm install --no-audit --no-fund $CAP_PACKAGES && cd ..
          node app-shell/configure.mjs "$CONFIG"
          [ "$(jq -r .app_id "$CONFIG")" = "$PACKAGE" ] || { echo "Build config app_id doesn't match the Google files"; exit 1; }
          jq '.push_android = true' app-shell/www/config.json > app-shell/www/c.json && mv app-shell/www/c.json app-shell/www/config.json
          cd app-shell && npx cap add android
          cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json
          npx cap sync android
      - name: Build the signed app
        working-directory: app-shell/android
        run: |
          ./gradlew assembleRelease --no-daemon -q \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" -Pandroid.injected.signing.store.password="$KEY_PASS" \
            -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password="$KEY_PASS"
          rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/google-services.json"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app.apk"
          ls -la "$RUNNER_TEMP/app.apk"
      - name: Allow the virtual phone to use the CPU's virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on a virtual Android phone and send it a notification
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ runner.temp }}/app.apk
          SHOTS: ${{ runner.temp }}/shots
          RUN_ID: ${{ github.run_id }}
        with:
          api-level: 34
          target: playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/android-device-test.sh
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-screens
          path: ${{ runner.temp }}/shots
          retention-days: 14
          if-no-files-found: ignore

  # Attach an already uploaded build (platforms=ios-attach, attach_build=<build number>): the same step as after an
  # upload, on its own, for a build made before that step existed or when it timed out waiting for Apple.
  ios-attach:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'ios-attach' && inputs.attach_build != ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the app id, version and App Store Connect key from the worker
        run: |
          [[ "${{ inputs.attach_build }}" =~ ^[0-9]+$ ]] || { echo "attach_build must be a build number"; exit 1; }
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=menu-made-store-build" | jq -r .value)
          echo "::add-mask::$token"
          if [ -n "$STORE_APP" ]; then
            target="store_app=$STORE_APP"
            curl -sSf -H "Authorization: Bearer $token" "https://menu-made.com/api/store-build/config?$target" | jq '.config' > "$RUNNER_TEMP/build.json"
          else
            target="scope=owner"; cp "$SAMPLE_CONFIG" "$RUNNER_TEMP/build.json"
          fi
          curl -sSf -H "Authorization: Bearer $token" "https://menu-made.com/api/store-build/credentials?$target" -o "$RUNNER_TEMP/creds.json"
          jq -r .apple.p8 "$RUNNER_TEMP/creds.json" | while IFS= read -r line; do if [ -n "$line" ]; then echo "::add-mask::$line"; fi; done
          jq -r .apple.p8 "$RUNNER_TEMP/creds.json" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "ASC_KEY_ID=$(jq -r .apple.key_id "$RUNNER_TEMP/creds.json")"
            echo "ASC_ISSUER_ID=$(jq -r .apple.issuer_id "$RUNNER_TEMP/creds.json")"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/creds.json"
          echo "Key received"
      - name: Put the build in TestFlight and the waiting App Store version
        run: |
          app_id=$(jq -r .app_id "$RUNNER_TEMP/build.json"); version=$(jq -r '.version // "1.0.0"' "$RUNNER_TEMP/build.json")
          node booking-api/scripts/asc-attach-build.mjs "$RUNNER_TEMP/AuthKey.p8" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$app_id" "$version" "${{ inputs.attach_build }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/creds.json"
