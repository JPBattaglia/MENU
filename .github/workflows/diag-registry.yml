name: diag-registry
on: { push: { branches: [diag-registry] } }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B='https://data.sf.gov/resource/g8m3-pdis.json'
          curl -sG "$B" --data-urlencode '$select=self_reported_naics_code,count(*) AS n' --data-urlencode "\$where=location_start_date >= '2026-07-10T00:00:00'" --data-urlencode '$group=self_reported_naics_code' --data-urlencode '$order=n DESC' | head -c 3000; echo
          echo ---lic
          curl -sG "$B" --data-urlencode '$select=lic_code_description,count(*) AS n' --data-urlencode "\$where=location_start_date >= '2026-07-10T00:00:00'" --data-urlencode '$group=lic_code_description' --data-urlencode '$order=n DESC' --data-urlencode '$limit=25' | head -c 3000; echo
          echo ---city
          curl -sG "$B" --data-urlencode '$select=city,count(*) AS n' --data-urlencode "\$where=location_start_date >= '2026-07-10T00:00:00'" --data-urlencode '$group=city' --data-urlencode '$order=n DESC' --data-urlencode '$limit=8' | head -c 3000; echo
          echo ---keys
          curl -sG "$B" --data-urlencode '$limit=1' --data-urlencode '$order=location_start_date DESC' | head -c 1500; echo | head -c 3000; echo
