# Temporary probe (Stage 12 task 7): can the deploy token read D1 usage from Cloudflare's GraphQL analytics? Never fails.
name: probe-d1-usage
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          acc="$ACC"; [ -n "$acc" ] || acc=$(curl -sS -H "Authorization: Bearer $CF" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          echo "::notice::account found: $([ -n "$acc" ] && echo yes || echo no)"
          d=$(date -u +%F)
          q='{"query":"query($a:String!,$d:Date!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:10,filter:{date_geq:$d}){sum{rowsRead rowsWritten}dimensions{date databaseId}}}}}","variables":{"a":"'"$acc"'","d":"'"$d"'"}}'
          curl -sS -H "Authorization: Bearer $CF" -H "Content-Type: application/json" https://api.cloudflare.com/client/v4/graphql --data "$q" | jq -c '{errors: .errors, groups: .data.viewer.accounts[0].d1AnalyticsAdaptiveGroups}' | sed "s/^/::notice::/" || true
          curl -sS -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$acc/subscriptions" | jq -c '{errors: .errors, subs: [.result[]? | {rate_plan: .rate_plan.id, product: .product.name}]}' | sed "s/^/::notice::/" || true
